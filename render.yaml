# ─── Render Blueprint (dev environment) ─────────────────────────────────────────
# One-click deploy: Render Dashboard → New → Blueprint → connect this repo.
#
# Expects an EXTERNAL Postgres (Neon recommended — Render's free Postgres
# expires after 30 days). Create a Neon project first, then paste its
# pooled connection string (with ?sslmode=require) as DATABASE_URL when
# prompted.
#
# How it works:
# - `runtime: docker` builds the `production` stage of ./Dockerfile
#   (last stage = default). entrypoint.sh runs `prisma migrate deploy`
#   before `node dist/main.js`, so schema is never stale.
# - `healthCheckPath: /` hits AppController.getHello().
# - PORT is injected by Render automatically — do not set it here.
#   main.ts listens on process.env.PORT ?? 3000 on 0.0.0.0.
# - JWT secrets are auto-generated on first deploy (generateValue).
# - Set CORS_ORIGIN to your frontend URL(s), comma-separated, e.g.
#   https://job-tracker-frontend.vercel.app,http://localhost:5173
#   Leave empty to allow all origins (dev only).
services:
  - type: web
    name: job-tracker-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        sync: false
